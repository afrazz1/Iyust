<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - GLTFloader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - GLTFLoader<br />
			<a href="https://hdrihaven.com/hdri/?h=royal_esplanade" target="_blank" rel="noopener">Royal Esplanade</a> from <a href="https://hdrihaven.com/" target="_blank" rel="noopener">HDRI Haven</a>
		</div>

		<link type="text/css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/css/main.css">

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let camera, scene, renderer, controls;
			let currentModel, mixer;
			const annotations = [];
			let currentLoadId = 0;

			const clock = new THREE.Clock();

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new THREE.Scene();
					scene.background = new THREE.Color( 0x222222 );

					const ambient = new THREE.AmbientLight( 0xffffff, 0.6 );
					scene.add( ambient );

					const directional = new THREE.DirectionalLight( 0xffffff, 0.8 );
					directional.position.set( 5, 10, 7 );
					scene.add( directional );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				container.appendChild( renderer.domElement );
				renderer.setAnimationLoop( render );

				// load local model
				const loader = new GLTFLoader();
				loader.load( 'models/gltf/scene.gltf', function ( gltf ) {

					currentModel = gltf.scene;

					// wait until the model can be added to the scene without blocking due to shader compilation
					renderer.compileAsync( currentModel, camera, scene ).then( () => {

						scene.add( currentModel );
						createAnnotations();

						fitCameraToSelection( camera, controls, currentModel );

						// animations
						if ( gltf.animations.length > 0 ) {

							mixer = new THREE.AnimationMixer( currentModel );

							for ( const animation of gltf.animations ) {

								mixer.clipAction( animation ).play();

							}

						}

					} );

				} );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.target.set( 0, 0, - 0.2 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function loadModel( modelInfo ) {

				const variants = modelInfo.variants;
				const variant = variants[ 'glTF-Binary' ] || variants[ 'glTF' ];
				const url = `https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/${ modelInfo.name }/${ variant.endsWith( '.glb' ) ? 'glTF-Binary' : 'glTF' }/${ variant }`;

				if ( currentModel ) {

					scene.remove( currentModel );
					currentModel = null;

				}

				if ( mixer ) {

					mixer.stopAllAction();
					mixer = null;

				}

				const loadId = ++ currentLoadId;

				const loader = new GLTFLoader();
				loader.load( url, async function ( gltf ) {

					if ( loadId !== currentLoadId ) return;

					currentModel = gltf.scene;

					// wait until the model can be added to the scene without blocking due to shader compilation

					await renderer.compileAsync( currentModel, camera, scene );

					if ( loadId !== currentLoadId ) return;

					scene.add( currentModel );

					fitCameraToSelection( camera, controls, currentModel );

					// animations

					if ( gltf.animations.length > 0 ) {

						mixer = new THREE.AnimationMixer( currentModel );

						for ( const animation of gltf.animations ) {

							mixer.clipAction( animation ).play();

						}

					}

				} );

			}

			function createAnnotations() {

	// очистка старых
	for (const ann of annotations) {
		ann.element.remove();
	}
	annotations.length = 0;

	// пример точек (можешь менять координаты)
	const points = [
		{ position: new THREE.Vector3(0, 0.5, 0), label: "Точка №1" },
		{ position: new THREE.Vector3(0.5, 0.2, 0), label: "Точка №2" }
	];

	for (const p of points) {

		const div = document.createElement('div');
		div.className = 'annotation';
		div.dataset.label = p.label;
		document.body.appendChild(div);

		annotations.push({
			position: p.position,
			element: div
		});
	}
}
			function fitCameraToSelection( camera, controls, selection, fitOffset = 1.3 ) {

				const box = new THREE.Box3();
				box.setFromObject( selection );

				const size = box.getSize( new THREE.Vector3() );
				const center = box.getCenter( new THREE.Vector3() );

				const maxSize = Math.max( size.x, size.y, size.z );
				const fitHeightDistance = maxSize / ( 2 * Math.atan( Math.PI * camera.fov / 360 ) );
				// const fitWidthDistance = fitHeightDistance / camera.aspect;
				// const distance = fitOffset * Math.max( fitHeightDistance, fitWidthDistance );
				const distance = fitOffset * fitHeightDistance;

				const direction = controls.target.clone().sub( camera.position ).normalize().multiplyScalar( distance );

				controls.maxDistance = distance * 10;
				controls.minDistance = distance / 10;
				controls.target.copy( center );

				camera.near = distance / 100;
				camera.far = distance * 100;
				camera.updateProjectionMatrix();

				camera.position.copy( controls.target ).sub( direction );

				controls.update();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			//
			function updateAnnotations() {

	for (const ann of annotations) {

		const pos = ann.position.clone();

		// если модель есть — привязываем к ней
		if (currentModel) {
			currentModel.localToWorld(pos);
		}

		pos.project(camera);

		const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
		const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;

		ann.element.style.left = `${x}px`;
		ann.element.style.top = `${y}px`;

		// скрытие если за камерой
		ann.element.style.display = pos.z < 1 ? 'block' : 'none';
	}
}

			function render() {

				const delta = clock.getDelta();

				controls.update();

				if ( mixer ) mixer.update( delta );

				renderer.render( scene, camera );
				
				updateAnnotations();
			}

		</script>
<style>
.annotation {
	position: absolute;
	width: 14px;
	height: 14px;
	border-radius: 50%;
	background: rgb(254, 254, 254);
	cursor: pointer;
	transform: translate(-50%, -50%);
}

.annotation:hover::after {
	content: attr(data-label);
	position: absolute;
	top: -30px;
	left: 50%;
	transform: translateX(-50%);
	background: black;
	color: white;
	padding: 4px 8px;
	font-size: 12px;
	border-radius: 4px;
	white-space: nowrap;
}
</style>
	</body>
</html>
